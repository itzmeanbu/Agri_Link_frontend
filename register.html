<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join AgriLink</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span><b>AgriLink</b></a></header><main class="section" style="max-width:620px"><p class="kicker">JOIN AGRILINK</p><h1>Create your account</h1><p class="muted">Your account will be reviewed by an administrator before access is enabled.</p><form id="registerForm" class="card" style="display:grid;gap:16px;margin-top:25px"><label>Full name<input name="name" required style="display:block;width:100%;padding:12px;margin-top:6px"></label><label>Phone<input name="phone" required style="display:block;width:100%;padding:12px;margin-top:6px"></label><label>Email<input type="email" name="email" required style="display:block;width:100%;padding:12px;margin-top:6px"></label><label>Password<input type="password" name="password" minlength="6" required style="display:block;width:100%;padding:12px;margin-top:6px"></label><label>Account type<select name="role" style="display:block;width:100%;padding:12px;margin-top:6px"><option value="farmer">Farmer</option><option value="fpo">FPO</option><option value="buyer">Buyer</option></select></label><button class="primary" type="submit">Submit registration →</button><p id="message" class="muted"></p><p>Already registered? <a href="login.html" style="color:var(--green);font-weight:700">Log in</a></p></form></main><script>const API = 'https://agri-link-backend-pae2.onrender.com';document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();const message=document.getElementById('message');const data=Object.fromEntries(new FormData(e.target));try{const response=await fetch(API+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error);message.textContent='Registration submitted. Wait for admin approval, then log in.';e.target.reset()}catch(error){message.textContent=error.message}};</script></body></html>
