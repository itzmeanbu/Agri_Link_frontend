<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | AgriLink</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span><b>AgriLink</b></a></header><main class="section" style="max-width:620px"><p class="kicker">WELCOME BACK</p><h1>Log in to AgriLink</h1><form id="loginForm" class="card" style="display:grid;gap:16px;margin-top:25px"><label>Email<input type="email" name="email" required style="display:block;width:100%;padding:12px;margin-top:6px"></label><label>Password<input type="password" name="password" required style="display:block;width:100%;padding:12px;margin-top:6px"></label><button class="primary" type="submit">Log in →</button><p id="message" class="muted"></p><p>New here? <a href="register.html" style="color:var(--green);font-weight:700">Create an account</a></p></form></main><script>const API=(window.AGRILINK_API_URL||'https://agrilink-backend.onrender.com');document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const message=document.getElementById('message');const data=Object.fromEntries(new FormData(e.target));try{const response=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error);localStorage.setItem('agrilink_token',result.token);localStorage.setItem('agrilink_user',JSON.stringify(result.user));location.href=result.user.role==='farmer'||result.user.role==='fpo'?'farmer.html':'index.html'}catch(error){message.textContent=error.message}};</script></body></html>
